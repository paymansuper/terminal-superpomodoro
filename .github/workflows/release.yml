name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  float-check:
    # make sure the Swift mini window still compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O -o superpomodoro-float macos/main.swift

  homebrew-tap:
    needs: [binaries, float-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -e "s/VERSION/${VERSION}/" -e "s/SHA256/${SHA}/" Formula/superpomodoro.rb > superpomodoro.rb
      - name: Push to tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/paymansuper/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp superpomodoro.rb tap/Formula/
          cd tap
          git config user.name "superpomodoro-release"
          git config user.email "release@users.noreply.github.com"
          git add Formula/superpomodoro.rb
          git commit -m "superpomodoro ${GITHUB_REF_NAME}" && git push
